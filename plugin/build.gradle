plugins {
    id 'java-library'
    id 'xyz.jpenilla.run-paper' version '3.1.0'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24'
}

group = 'lol.hub'
version = project.plugin_version

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
        content {
            includeGroup 'com.mojang'
            includeGroup 'io.papermc.paper'
            includeGroup 'net.kyori'
            includeGroup 'net.md-5'
        }
    }
}

dependencies {
    paperweight.paperDevBundle("${project.minecraft_version}.build.${project.paper_build}-stable")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
}
tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
    it.options.encoding = 'UTF-8'
}

// A human joins at localhost, an agent drives the console over RCON. Loopback only, so the
// fixed password exposes nothing. Written on every launch: run/ outlives the sessions.
def runServerProperties = [
        'server-ip'        : '127.0.0.1',
        'server-port'      : '25565',
        'online-mode'      : 'false',
        'white-list'       : 'false',
        'enforce-whitelist': 'false',
        'enable-rcon'      : 'true',
        'rcon.port'        : '25575',
        'rcon.password'    : 'testutils',
]

tasks {
    runServer {
        minecraftVersion("${project.minecraft_version}")
        // The library project downloads and verifies the pinned jar the tests boot, so a failing
        // test reproduces on the same build. Without this run-paper fetches the latest build.
        dependsOn ':library:paperJar'
        serverJar(layout.file(provider { project(':library').ext.paperJarFile }))
        jvmArgs("-Dcom.mojang.eula.agree=true", "-DPaper.skipServerPropertiesComments=true")
        // The tests patch Paper into this directory once. Without it every run/ directory downloads and patches again.
        jvmArgumentProviders.add({ ["-DbundlerRepoDir=" + new File(project(':library').ext.paperJarFile.parentFile, 'repo')] } as CommandLineArgumentProvider)
        doFirst {
            def file = runDirectory.file('server.properties').get().asFile
            def written = [] as Set
            def lines = (file.isFile() ? file.readLines() : []).collect { line ->
                def key = line.split('=', 2)[0].trim()
                if (!line.startsWith('#') && runServerProperties.containsKey(key)) {
                    written << key
                    return "${key}=${runServerProperties[key]}".toString()
                }
                line
            }
            runServerProperties.each { key, value -> if (!(key in written)) lines << "${key}=${value}".toString() }
            file.parentFile.mkdirs()
            file.text = lines.join('\n') + '\n'
        }
    }
}

processResources {
    def modVersion = version
    def mcVersion = minecraft_version
    inputs.property('modVersion', modVersion)
    inputs.property('mcVersion', mcVersion)
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        filter { line -> line.replace('@mod_version@', modVersion) }
        filter { line -> line.replace('@minecraft_version@', mcVersion) }
    }
}

jar.archiveFileName.set("testutils-${project.version}+${project.minecraft_version}-paper.jar")
jar.destinationDirectory.set(layout.buildDirectory.dir('dist'))

// Released next to the jars, so a consumer pins only the TestUtils version and reads the Paper build from here.
def pinProperties = tasks.register('pinProperties', WriteProperties) {
    destinationFile = layout.buildDirectory.file("dist/testutils-${project.version}.properties")
    property('minecraft_version', project.minecraft_version)
    property('paper_build', project.paper_build)
    property('paper_sha256', project.paper_sha256)
}
tasks.named('assemble') { dependsOn pinProperties }
