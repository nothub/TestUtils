plugins {
    id 'java-library'
}

group = 'lol.hub'
version = project.plugin_version

repositories {
    mavenCentral()
}

dependencies {
    // Consumers bring their own: the library jar ships without dependency metadata.
    compileOnly platform('org.junit:junit-bom:6.1.3')
    compileOnly 'org.junit.jupiter:junit-jupiter-api'
    compileOnly 'com.google.code.gson:gson:2.14.0'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
}
tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
    it.options.encoding = 'UTF-8'
}

jar.archiveFileName.set("testutils-library-${project.version}.jar")
jar.destinationDirectory.set(layout.buildDirectory.dir('dist'))
